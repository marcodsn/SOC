# =============================================================================
# SOC Model Presets
# =============================================================================
# Named model configurations for quick switching via --preset <name>.
# Each preset specifies a model_id, provider, and generation parameters.
#
# Usage:
#   python scripts/01_gen_personas.py --preset kimi_k2
#   python scripts/03_gen_conversations.py --preset glm5 --summarizer-preset kimi_k2

# ── Presets ──────────────────────────────────────────────────────────────────

presets:
  kimi_k2:
    model_id: "moonshotai/Kimi-K2-Instruct-0905"
    provider: "huggingface"
    temperature: 1.0
    max_tokens: 8192

  kimi_k25:
    model_id: "moonshotai/Kimi-K2.5:fireworks-ai"
    provider: "huggingface"
    temperature: 1.0
    max_tokens: 8192

  glm5:
    model_id: "zai-org/GLM-5:fireworks-ai"
    provider: "huggingface"
    temperature: 1.0
    max_tokens: 8192

  local_default:
    model_id: "unsloth/Qwen3.5-35B-A3B-UD-Q4_K_XL"
    provider: "local"
    temperature: 1.0
    max_tokens: 16384

  local_small:
    model_id: "unsloth/Qwen3.5-35B-A3B-UD-Q4_K_XL"
    provider: "local"
    temperature: 1.0
    max_tokens: 16384
    # Good choice for summarization — cheaper and faster

# ── Default Models ───────────────────────────────────────────────────────────
# Which preset to use when no --model or --preset flag is provided.

defaults:
  generation: "local_default"
  summarizer: "local_small"

# ── Provider Endpoints ───────────────────────────────────────────────────────
# Base URLs and environment variable names for API keys.
# These are referenced by the provider field in each preset.

providers:
  local:
    base_url: "http://10.8.0.5:8083/v1"
    api_key_env: "HF_TOKEN"

  huggingface:
    base_url: "https://router.huggingface.co/v1"
    api_key_env: "HF_TOKEN"

  nim:
    base_url: "https://integrate.api.nvidia.com/v1"
    api_key_env: "NVIDIA_API_KEY"

  modal:
    base_url: "https://api.us-west-2.modal.direct/v1"
    api_key_env: "MODAL_TOKEN"

  mistral:
    # Mistral uses its own SDK, not the OpenAI-compatible endpoint
    api_key_env: "MISTRAL_API_KEY"
