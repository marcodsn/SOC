[project]
name = "soc"
version = "0.2.0"
description = "Synthetic Online Conversations — a pipeline for generating realistic, persona-grounded synthetic dialogue datasets."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "huggingface-hub>=1.4.1",
    "jinja2>=3.1.6",
    "mistralai>=1.12.4",
    "numpy>=2.0.0",
    "openai>=1.40.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "pytest>=8.0.0",
]
